<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0b0d" />
<title>Owner dashboard — Lily MD</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.2" height="6.2" rx="1.4"/><rect x="13.8" y="4" width="6.2" height="6.2" rx="1.4"/><rect x="4" y="13.8" width="6.2" height="6.2" rx="1.4"/><rect x="13.8" y="13.8" width="6.2" height="6.2" rx="1.4"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.2 13.8a4.4 4.4 0 0 0 6.2 0l3-3A4.4 4.4 0 0 0 13.2 4.6l-1.7 1.7"/><path d="M13.8 10.2a4.4 4.4 0 0 0-6.2 0l-3 3a4.4 4.4 0 0 0 6.2 6.2l1.7-1.7"/></symbol>
  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/><path d="M10 2.5v3M14 2.5v3M10 18.5v3M14 18.5v3M2.5 10h3M2.5 14h3M18.5 10h3M18.5 14h3"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.9 8.9 0 0 1-3.8-.9L3.5 21l1.4-5.2A8.5 8.5 0 1 1 21 11.5Z"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 10 3 2.5L7 15M13 15h4"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3.5v4M15 3.5v4M7 7.5h10v4.5a5 5 0 0 1-10 0V7.5ZM12 16.5V21"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5.6M17.5 14.6A5 5 0 0 1 20.5 19"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V6l7-3Z"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2.1-1 2.1-2s-.8-2-.8-3c0-1.2 1-2 2.4-2H18a3 3 0 0 0 3-3 9 9 0 0 0-9-8Z"/><circle cx="8" cy="9" r="1"/><circle cx="12" cy="7" r="1"/><circle cx="16" cy="9" r="1"/></symbol>
  <symbol id="i-user-check" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M14.8 12.2l2.4 2.4L22 10"/></symbol>
  <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M4 17 10 11l3.5 3.5L20 8"/><path d="M15 8h5v5"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h10M18.5 8H20M4 16h4M12.5 16H20"/><circle cx="16.2" cy="8" r="2.2"/><circle cx="10.2" cy="16" r="2.2"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.4 6.4M20 5v6h-6"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4.5V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2v-.5M10 12h11m0 0-3-3m3 3-3 3"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</svg>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/logo.png" alt="Lily MD" onerror="this.style.visibility='hidden'" />
      <div class="brand-text"><strong>Lily MD</strong><span>Owner console</span></div>
    </div>

    <nav class="nav" id="nav" aria-label="Dashboard sections"></nav>

    <div class="sidebar-foot">
      <a href="./" target="_blank" rel="noopener">
        <svg class="icon sm"><use href="#i-arrow"/></svg>Pairing page
      </a>
      <a href="#" id="logout">
        <svg class="icon sm"><use href="#i-logout"/></svg>Sign out
      </a>
      <div id="who" class="who"></div>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn ghost icon-only small menu-toggle" id="menu-toggle" aria-label="Open menu">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <div class="titles">
          <div class="crumb" id="crumb">Dashboard</div>
          <h1 id="title">Overview</h1>
        </div>
      </div>
      <div class="top-actions">
        <span class="status-pill" id="status-pill">
          <span class="dot"></span><span id="status-text">Checking…</span>
        </span>
        <button class="btn ghost icon-only small" id="refresh" aria-label="Refresh" title="Refresh">
          <svg class="icon sm"><use href="#i-refresh"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="view" aria-live="polite">
      <div class="grid cols-4">
        <div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </main>
  </div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
